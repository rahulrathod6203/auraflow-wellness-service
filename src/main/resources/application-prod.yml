spring:
  application:
    name: AuraWellnessPlatform
  main:
    banner-mode: off
  sql:
    init:
      mode: never          # Ensures any test schemas or data seed scripts run automatically

  # Database configuration (PostgreSQL)
  datasource:
    url: ${POSTGRES_DB_URL}          # Expected format: jdbc:postgresql://localhost:5432/your_db_name
    username: ${POSTGRES_DB_USERNAME}
    password: ${POSTGRES_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA Hibernate configuration
  jpa:
    show-sql: true          # Enabled so you can see the queries executing during your tests
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate     # Alternately, use 'create-drop' to wipe and recreate tables per test suite execution
    properties:
      hibernate:
        format_sql: true    # Pretty-prints SQL queries in your test console logs

# JWT
app:
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-milliseconds: ${JWT_EXPIRATION}